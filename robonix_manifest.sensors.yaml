manifestVersion: 1
name: robonix-sensors-test

# Minimal bring-up for the Ranger Mini perception stack. It starts static TF,
# MID-360 lidar/IMU, RealSense D435i, and RTAB-Map. It intentionally does not
# start chassis, nav2, speech, scene, audio, explore, or welcome.

env:
  ROBONIX_MAPPING_RGB_ZC: "1"
  ROBONIX_MAPPING_DEPTH_ZC: "1"
  ROBONIX_MAPPING_SCAN_CLOUD_ZC: "1"
  ROBONIX_MAPPING_RGB_ZC_TOPIC: "/camera/rgb_zc"
  ROBONIX_MAPPING_DEPTH_ZC_TOPIC: "/camera/depth_zc"
  ROBONIX_MAPPING_SCAN_CLOUD_ZC_TOPIC: "/scanner/cloud_zc"
  ROBONIX_MAPPING_RGB_ZC_SHM: "robonix_zc_camera"
  ROBONIX_MAPPING_RGB_ZC_SHM_SIZE: "67108864"
  RBNX_BUILD_TARGET: jetson-native
  ROBONIX_MAPPING_FORCE: native
  ROBONIX_MAPPING_PLATFORM: jetson_orin

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info

primitive:
  - name: ranger_description
    url: https://github.com/lhw2002426/ranger_description_rbnx
    branch: main
    config:
      launch_args:
        lidar_x:  "0.18"
        lidar_y:  "0.00"
        lidar_z:  "0.425"
        camera_x: "0.28"
        camera_y: "0.00"
        camera_z: "0.30"
      spawn_grace_s: 1.5

  - name: mid360_lidar
    path: /home/warth/Desktop/code/ros_driver/mid360_lidar_rbnx
    config:
      lidar_topic: /scanner/cloud
      lidar_zc_topic: /scanner/cloud_zc
      lidar_ip: 192.168.1.161
      xfer_format: 0
      zc_shm_name: robonix_zc_camera
      zc_shm_size: 67108864
      sentinel_timeout_s: 30.0

  - name: mid360_imu
    path: /home/warth/Desktop/code/ros_driver/mid360_imu_rbnx
    config:
      imu_topic: /livox/imu
      sentinel_timeout_s: 30.0

  - name: realsense_camera
    path: /home/warth/Desktop/code/ros_driver/realsense_camera_rbnx
    config:
      camera_name: camera_435i
      rgb_profile: 640x480x15
      depth_profile: 480x270x15
      align_depth: true
      enable_imu: false
      enable_sync: true
      enable_pointcloud: true
      rgb_zc_topic: /camera/rgb_zc
      depth_zc_topic: /camera/depth_zc
      pointcloud_zc_topic: /camera/pointcloud_zc
      zc_shm_name: robonix_zc_camera
      zc_shm_size: 67108864
      sentinel_timeout_s: 30.0

service:
  - name: mapping
    url: https://github.com/ZZJJWarth/mapping_rbnx
    branch: zc_immigrate
    config:
      algo: rtabmap
      platform: jetson_orin
      base_frame: base_link
      use_sim_time: false
      sensors:
        lidar2d: false
        lidar3d: true
        rgb: true
        rgbd: true
        imu: false
        odom: false
      map_mode: mapping
